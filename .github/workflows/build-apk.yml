name: Build Android Apps
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APKs
        run: gradle assembleDebug
      - name: Upload workout journal
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutJournal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Sky Hopper game
        uses: actions/upload-artifact@v4
        with:
          name: SkyHopper-game-apk
          path: gameapp/build/outputs/apk/debug/gameapp-debug.apk
          if-no-files-found: error
          retention-days: 30
